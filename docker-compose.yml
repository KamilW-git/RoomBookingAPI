# PostgreSQL dla Room Booking API.
# Wartości pochodzą z pliku .env (Docker Compose czyta go automatycznie z tego katalogu).
services:
  db:
    image: postgres:16 # konkretna wersja obrazu
    container_name: roombooking-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - roombooking_pgdata:/var/lib/postgresql/data # nazwany volume: dane przetrwają restart kontenera
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  roombooking_pgdata:
